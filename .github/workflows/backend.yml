# Backend CI (backend/plans/school-courses/TESTING.md §12, SC-005).
name: backend

on:
  push:
    branches: [master, feature/dev]
    paths: ["backend/**", "migrations/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "migrations/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  unit-api:
    runs-on: ubuntu-latest
    env:
      # Unreachable on purpose: unit/API tests must never touch a real database.
      DATABASE_URL: postgresql://x:y@127.0.0.1:1/none
      SCHEDULER_ENABLED: "false"
      # Pre-existing failures run as non-strict xfails; any new failure fails the job.
      ECALT_KNOWN_FAILURES: xfail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -m "not integration and not schools_db"

  schools-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecalt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ecalt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://x:y@127.0.0.1:1/none
      SCHEDULER_ENABLED: "false"
      # Disposable service container; the harness refuses any non-local or non-ecalt_test URL.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecalt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -m schools_db
