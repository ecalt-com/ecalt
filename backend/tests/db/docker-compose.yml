# Disposable Postgres for DB integration tests (plans/school-courses/TESTING.md §3, L3).
#
#   docker compose -f backend/tests/db/docker-compose.yml up -d
#   export TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54329/ecalt_test
#   cd backend && pytest -m schools_db
#
# Data lives in tmpfs: stopping the container throws everything away.
services:
  ecalt-test-db:
    image: postgres:15-alpine
    container_name: ecalt-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecalt_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
